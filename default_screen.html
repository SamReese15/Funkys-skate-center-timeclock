<!doctype html>

<html>

<head>
  <title>Funkys Skate Center</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="main-content">

    <h1 class="animated">Funkys Skate Center</h1>

    <div class="date">
      <p id="daily-date">Loading Date...</p>
    </div>

    <div class="time" id="time-clock">Loading Time...</div>

    <div class="welcome-button">
      <button class="log-in" id="loginButton">Log In</button>
    </div>
  </div>

  <nav class="navbar">
    <div class="nav-links">
      <button class="out-btn">Clock In</button>
    </div>
    <div class="nav-time" id="nav-time-clock">Loading Time...</div>
    <div class="spacer">
      <button class="in-btn">Clock Out</button>
    </div>
  </nav>

  <!-- start for popup password input, login button funactionality -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-window">

      <div class="exit">
        <button id="closeLogin">✘</button>
      </div>

      <input type="password" id="pinDisplay" maxlength="4" readonly placeholder="Enter Password">

      <div class="keypad">
        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button id="clearPin">Clear</button>
        <button data-number="0">0</button>
        <button id="deletePin">⌫</button>
      </div>

      <div class="submit-btn">
        <button id="submitPin" class="submit-pin">Submit</button>
      </div>

      <div class="forgot-btn">
        <button id="forgotPin" class="forgot-pin">Forgot Password?</button>
      </div>

    </div>
  </div>
</body>

</html>

<script>
  const now = new Date();
  // Update the month title and year in the top bar
  document.getElementById('daily-date').textContent = "Today: " + (now.getMonth() + 1) + '/' + now.getDate() + "/" + now.getFullYear();

  const formattedTime = now.toLocaleTimeString();
  const navTime = document.getElementById("nav-time-clock");
  //update the time
  document.getElementById('time-clock').textContent = "Time: " + formattedTime;
  navTime.innerText = "";

  //log in button
  const loginButton = document.getElementById("loginButton");
  const loginOverlay = document.getElementById("loginOverlay");
  const pinDisplay = document.getElementById("pinDisplay");
  const submitPin = document.getElementById("submitPin");
  const clearPin = document.getElementById("clearPin");
  const deletePin = document.getElementById("deletePin");
  const closeLogin = document.getElementById("closeLogin");
  const forgotPin = document.getElementById("forgotPin");

  loginButton.addEventListener("click", () => {
    loginOverlay.style.display = "flex";
  });

  document.querySelectorAll("[data-number]").forEach(button => {
    button.addEventListener("click", () => {
      if (pinDisplay.value.length < 4) {
        pinDisplay.value += button.dataset.number;
      }
    });
  });

  //clear button
  clearPin.addEventListener("click", () => {
    pinDisplay.value = "";
  });

  //delete button
  deletePin.addEventListener("click", () => {
    pinDisplay.value = pinDisplay.value.slice(0, -1);
  });

  //submit / log in button
  const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyTUEcHvJc4ZPJyOiY5lxpAGaoelv4vtvWi9ZmBogmr_SYQvZylfWT78Bl8NzDnmI0D2w/exec"; //change this before deployment

  submitPin.addEventListener("click", async() => {
    //make sure it's four digits
    const pin = pinDisplay.value;

    //make sure its length is 4
    if (pin.length !== 4) {
      alert("Please enter a 4-digit password.");
      return;
    }

    submitPin.disabled = true; // Disable the button to prevent multiple submissions
    submitPin.textContent = "Submitting..."; // Change button text to indicate submission

    //sends pin to google script
    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",

        body: JSON.stringify({ pin: pin

        }),
      });

      //gets result from google script
      const result = await response.json();

      console.log(result); // for debugging purposes

      if (result.success) {
        navTime.innerText = "Time: " + formattedTime;

        loginOverlay.style.display = "none";
        pinDisplay.value = "";

        submitPin.disabled = false;
        submitPin.textContent = "Submit";

        console.log("Logged in as: " + result.name);
      } else {
        alert("Invalid password.");
        pinDisplay.value = "";
        submitPin.disabled = false;
        submitPin.textContent = "Submit";
      }

    //catches error in case something goes wrong
  } catch (error) {
    console.error("Error logging in: ", error);
    alert("Unable to log in. Please contact manager.");

    submitPin.disabled = false;
    submitPin.textContent = "Submit";
  }
});



  //exit button
  closeLogin.addEventListener("click", () => {
    loginOverlay.style.display = "none";
    pinDisplay.value = "";
  });

  //forgot password
  forgotPin.addEventListener("click", () => {
    alert("Password is the last 4 of your SSN.");
  });
</script>
