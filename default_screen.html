<!doctype html>

<html>

<head>
  <title>Funkys Skate Center</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="main-content">

    <h1 class="animated">Funkys Skate Center</h1>

    <div class="date">
      <p id="daily-date">Loading Date...</p>
    </div>

    <div class="time" id="time-clock">Loading Time...</div>

    <div class="welcome-button">
      <button class="log-in" id="loginButton">Log In</button>
    </div>
  </div>

  <nav class="navbar">
    <div class="nav-links">
      <button class="out-btn">Clock In</button>
    </div>
    <div class="nav-time" id="nav-time-clock">Loading Time...</div>
    <div class="spacer">
      <button class="in-btn">Clock Out</button>
    </div>
  </nav>

  <!-- start for popup password input, login button funactionality -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-window">

      <div class="exit">
        <button id="closeLogin">✘</button>
      </div>

      <input
        type="password"
        id="pinDisplay"
        maxlength="4"
        readonly
        placeholder="Enter Password"
      >

      <div class="keypad">
        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button id="clearPin">Clear</button>
        <button data-number="0">0</button>
        <button id="deletePin">⌫</button>
      </div>

        <button id="submitPin" class="submit-pin">Submit</button>
        <button id="forgotPin" class="forgot-pin">Forgot Password?</button>
    </div>
  </div>
  <!-- FORGOT PASSWORD POPUP-->
  <div class="forgot-overlay" id="forgotOverlay">
    <div class="forgot-window">
      <h2>Forgot Password?</h2>

      <p>
        Password is the last four of your SSN
      </p>

      <button id="closeForgot">X</button>
    </div>
  </div>
</body>

</html>

<script>
  const now = new Date();
    // Update the month title and year in the top bar
    document.getElementById('daily-date').textContent = "Today: " + (now.getMonth() + 1) + '/' + now.getDate() + "/" + now.getFullYear();

  const formattedTime = now.toLocaleTimeString();
    //update the time
    document.getElementById('time-clock').textContent = "Time: " + formattedTime;
    document.getElementById('nav-time-clock').innerText = "Time: " + formattedTime;

    //log in button
    const loginButton = document.getElementById("loginButton");
    const loginOverlay = document.getElementById("loginOverlay");
    const pinDisplay = document.getElementById("pinDisplay");
    const submitPin = document.getElementById("submitPin");
    const clearPin = document.getElementById("clearPin");
    const deletePin = document.getElementById("deletePin");

    loginButton.addEventListener("click", () => {
      loginOverlay.style.display = "flex";
    });

    document.querySelectorAll("[data-number]").forEach(button => {
      button.addEventListener("click", () => {
        if (pinDisplay.value.length < 4) {
          pinDisplay.value += button.dataset.number;
        }
      });
    });

    //clear button
    clearPin.addEventListener("click", () => {
      pinDisplay.value = "";
    });

    //delete button
    deletePin.addEventListener("click", () => {
      pinDisplay.value = pinDisplay.value.slice(0, -1);
    });

    //submit button
    submitPin.addEventListener("click", () => {
      const pin = pinDisplay.value;

      if (pin.length !== 4) {
        alert("Please enter a 4-digit password.");
        return;
      }

      console.log("Password entered:", pin);
    });
</script>
