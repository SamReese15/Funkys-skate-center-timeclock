<!doctype html>

<html>

<head>
  <title>Funkys Skate Center</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="main-content">

    <h1 class="animated">Funkys Skate Center</h1>

    <div class="date">
      <p id="daily-date">Loading Date...</p>
    </div>

    <div class="time" id="time-clock">Loading Time...</div>

    <div class="welcome-button">
      <button class="log-in" id="loginButton">Log In</button>
    </div>

    <div class="log-out-button">
      <button class="log-out" id="logOutButton">Log Out</button>
    </div>
  </div>

  <nav class="navbar">
    <div class="nav-links">
      <button class="in-btn" id="clock-in">Clock In</button>
      <button class="new-pay-period" id="newPayPeriod">New Pay Period</button>
    </div>
    <div class="nav-time" id="nav-time-clock">Loading Time...</div>
    <div class="spacer">
      <button class="out-btn" id="clock-out">Clock Out</button>
    </div>
  </nav>

  <!-- start for popup password input, login button functionality -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-window">

      <div class="exit">
        <button id="closeLogin">✘</button>
      </div>

      <input type="password" id="pinDisplay" maxlength="4" readonly placeholder="Enter Password">

      <div class="keypad">
        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button id="clearPin">Clear</button>
        <button data-number="0">0</button>
        <button id="deletePin">⌫</button>
      </div>

      <div class="submit-btn">
        <button id="submitPin" class="submit-pin">Submit</button>
      </div>

      <div class="forgot-btn">
        <button id="forgotPin" class="forgot-pin">Forgot Password?</button>
      </div>

    </div>
  </div>
</body>

</html>

<script>
  const now = new Date();
  // Update the month title and year in the top bar
  document.getElementById('daily-date').textContent = "Today: " + (now.getMonth() + 1) + '/' + now.getDate() + "/" + now.getFullYear();
  const formattedTime = now.toLocaleTimeString();
  const navTime = document.getElementById("nav-time-clock");
  const regTime = document.getElementById("time-clock");
  //update the time
  regTime.textContent = "Time: " + formattedTime;
  navTime.innerText = "";

  //log in button
  const loginButton = document.getElementById("loginButton");
  const logOutButton = document.getElementById("logOutButton")
  const loginOverlay = document.getElementById("loginOverlay");
  const pinDisplay = document.getElementById("pinDisplay");
  const submitPin = document.getElementById("submitPin");
  const clearPin = document.getElementById("clearPin");
  const deletePin = document.getElementById("deletePin");
  const closeLogin = document.getElementById("closeLogin");
  const forgotPin = document.getElementById("forgotPin");
  const clockIn = document.getElementById("clock-in");
  const clockOut = document.getElementById("clock-out");
  const newPayPeriod = document.getElementById("newPayPeriod");
  let name = null;
  let clockedIn = false;

  loginButton.addEventListener("click", () => {
    loginOverlay.style.display = "flex";
  });

  document.querySelectorAll("[data-number]").forEach(button => {
    button.addEventListener("click", () => {
      if (pinDisplay.value.length < 4) {
        pinDisplay.value += button.dataset.number;
      }
    });
  });

  //clear button
  clearPin.addEventListener("click", () => {
    pinDisplay.value = "";
  });

  //delete button
  deletePin.addEventListener("click", () => {
    pinDisplay.value = pinDisplay.value.slice(0, -1);
  });

  //log in button
  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwilvFuqb_y1UctPO_PmFx6Nd2hwWaTyCeDs4Oc7IKwVZPuWbCt1k41mdYUJKZ332AXDQ/exec"; //change this before deployment

  submitPin.addEventListener("click", async () => {
    //make sure it's four digits
    const pin = pinDisplay.value;

    //make sure its length is 4
    if (pin.length !== 4) {
      alert("Please enter a 4-digit password.");
      return;
    }

    submitPin.disabled = true; // Disable the button to prevent multiple submissions
    submitPin.textContent = "Submitting..."; // Change button text to indicate submission

    //sends pin to google script
    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",

        body: JSON.stringify({
          action: "login",
          pin: pin
        }),
      });

      //gets result from google script
      const result = await response.json();

      console.log(result); // for debugging purposes

      if (result.success) {
        name = result.name;

        if (name === "Callum" || name === "Rose") {
          newPayPeriod.style.display = "block"; // Show the new pay period button
        } else {
          newPayPeriod.style.display = "none";
        }

        navTime.innerText = "Time: " + formattedTime;
        regTime.textContent = "Logged in as: " + name;
        loginButton.style.display = "none"; // Hide the log in button
        logOutButton.style.display = "block"; // Show the log out button

        loginOverlay.style.display = "none";
        pinDisplay.value = "";

        submitPin.disabled = false;
        submitPin.textContent = "Submit";

        console.log("Logged in as: " + name);
      } else {
        alert("Invalid password.");
        pinDisplay.value = "";
        submitPin.disabled = false;
        submitPin.textContent = "Submit";
      }

      //catches error in case something goes wrong
    } catch (error) {
      console.error("Error logging in: ", error);
      alert("Unable to log in. Please contact manager.");

      submitPin.disabled = false;
      submitPin.textContent = "Submit";
    }
  });

  //log out button
  logOutButton.addEventListener("click", () => {
    navTime.innerText = "";
    regTime.textContent = "Time: " + formattedTime;
    loginButton.style.display = "block";
    logOutButton.style.display = "none";
    newPayPeriod.style.display = "none";
    name = "";
  });

  //exit button
  closeLogin.addEventListener("click", () => {
    loginOverlay.style.display = "none";
    pinDisplay.value = "";
  });

  //forgot password
  forgotPin.addEventListener("click", () => {
    alert("Password is the last 4 of your SSN.");
  });

  //clock in button
  clockIn.addEventListener("click", async () => {
    if (!name) {
      alert("Please log in first.");
      return;
    }

    clockIn.disabled = true;
    clockIn.textContent = "Clocking In...";

    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",

        body: JSON.stringify({
          action: "clockIn",
          name: name
        })
      });

      const result = await response.json();

      console.log(result);

      if (result.success) {
        clockedIn = true; // Set clockedIn status on successful clock in
        alert("Clocked in successfully. Welcome " + result.name + "!\n" + result.clockIn);
      } else {
        //says unable here for debugging purposes
        alert("Unable to clock in. Please try again or contact manager.");
      }
    } catch (error) {
      //says error clocking in here for debugging purposes
      console.error("Error clocking in: ", error);
      alert("Error clocking in. Please contact manager or try again.");
    }

    clockIn.disabled = false;
    clockIn.textContent = "Clock In";
  });

  //clock out button
  clockOut.addEventListener("click", async () => {
    if (!name) {
      alert("Please log in first.");
      return;
    }

    clockOut.textContent = "Clocking Out...";

    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",

        body: JSON.stringify({
          action: "clockOut",
          name: name
        })
      });

      const result = await response.json();

      console.log("Clock Out Result: ", result);

      if (result.success) {
        clockedIn = false; // Reset clockedIn status on successful clock out
        alert("Clocked out successfully. Goodbye " + result.name + "!\n" + result.clockOut);
      } else {
        //unable here for debugging purposes
        alert("Unable to clock out. Please try again or contact manager.");
      }

    } catch (error) {
      console.error("Error clocking out: ", error);
      //error here for debugging purposes
      alert("Error clocking out. Please try again or contact manager.");
    }

    clockOut.disabled = false;
    clockOut.textContent = "Clock Out";

  });

  //pay period button
  newPayPeriod.addEventListener("click", async () => {
    if (!name) {
      alert("Please log in first.");
      return;
    }

    if (name !== "Callum" && name !== "Rose") {
      alert("You do not have permission to start a new pay period.");
      return;
    }

    const confirmation = confirm("Are you sure you want to start a new pay period? \nThis action cannot be undone. \nThe current time sheet will be saved to history.");

    if (!confirmation) {
      return;
    }

    newPayPeriod.disabled = true;
    newPayPeriod.textContent = "Starting New Pay Period...";

    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",

        body: JSON.stringify({
          action: "newPayPeriod",
          name: name
        })
      });

      const result = await response.json();
      console.log("New Pay Period Result: ", result);

      if (result.success) {
        alert("New pay period started successfully!");
      } else {
        //says unable here for debugging purposes
        alert("Unable to start a new pay period");
      }
    } catch (error) {
      console.error("Error starting new pay period: ", error);
      alert("Error starting new pay period. "
        + "Please try again."
      );
    }

    newPayPeriod.disabled = false;
    newPayPeriod.textContent = "New Pay Period";
  });
</script>
